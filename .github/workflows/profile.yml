name: Atualizar perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Atualizar tempo de código
        run: python scripts/update_wakatime.py
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
      - name: Baixar biblioteca do Pac-Man
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: abozanona/pacman-contribution-graph
          ref: 294c47eff28a41339a279107ae771b5fa020037a
          path: .arcade
          persist-credentials: false
      - name: Gerar Pac-Man com contribuições reais
        id: arcade
        continue-on-error: true
        run: node scripts/generate_pacman.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Aplicar paleta azul e alternativa sem movimento
        if: steps.arcade.outcome == 'success'
        run: python scripts/prepare_pacman.py
      - name: Salvar atualizações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/wakatime.svg assets/wakatime-still.svg assets/pacman.svg assets/pacman-still.svg
          if [ -f assets/wakatime-data.json ]; then git add assets/wakatime-data.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Atualiza contribuições e tempo de código'
          git push
